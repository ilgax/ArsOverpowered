modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Ars Nouveau addon full of deliberately overpowered glyphs.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Load after Ars Nouveau so its registries/API are ready.
[[dependencies.${mod_id}]]
    modId="ars_nouveau"
    type="required"
    versionRange="${ars_version_range}"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config="ars_op.mixins.json"
